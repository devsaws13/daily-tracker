name: Daily Push Notifications

on:
  schedule:
    # 10:17 AM IST (04:47 UTC) - Bypasses the 10:00/10:30 AM rush
    - cron: '47 4 * * *'
    # 04:17 PM IST (10:47 UTC) - Bypasses the 4:00/4:30 PM rush
    - cron: '47 10 * * *'
  workflow_dispatch:

jobs:
  dispatch_alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install libsql-client

      - name: Run Alert Script
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python cron_alerts.py
